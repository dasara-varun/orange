services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ds_milk_world
      POSTGRES_PASSWORD: "JDmGJ1xI_OTLxWx88rQ4-XPbWO78g4J3"
    volumes:
      - ds_milk_world_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "EKTIIElH29Dz4BrX7P4BRLNTP27XANi-"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ds_milk_world_test
      POSTGRES_PASSWORD: "7daa5OtYmg5dA19_YCrxyCRW0Q31QEtG"
    volumes:
      - ds_milk_world_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "bd0qn8jib5QOXSPJ1frOmko0JO_UvOET"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  ds_milk_world_data:
  ds_milk_world_test_data:
